name: PR Validation & Policy Guardrails

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'templates/**'
      - 'deploy/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-contracts:
    name: Validate Declarative Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting & Schema Tools
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Platform Manifest Validator
        run: |
          python deploy/engine/validate.py --all

  test-container-builds:
    name: Verify Container Buildability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Template Starter Container
        run: |
          docker build --check templates/micro-app-starter/

      - name: Build Internal Portal Container
        run: |
          docker build --check apps/internal-portal/

  dry-run-reconciliation:
    name: Dry-Run Cloud Infrastructure Plan
    runs-on: ubuntu-latest
    needs: [validate-contracts]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Execute Reconciler Dry-Run (Starter App)
        run: |
          python deploy/engine/reconcile.py --app templates/micro-app-starter --dry-run

      - name: Execute Reconciler Dry-Run (Internal Portal)
        run: |
          python deploy/engine/reconcile.py --app apps/internal-portal --dry-run
